# The Certified Group Service (CGS) as an Atmosphere in a Box application. install.mjs copies this
# file into the sandbox checkout as stacks/cgs.yaml. AiaB adds the network, DNS name and CA trust.
services:
  cgs:
    build:
      context: ./cgs-source
    init: true
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      LOG_LEVEL: info
      NODE_EXTRA_CA_CERTS: /ca/root.crt
    volumes:
      - cgs-data:/app/data
    depends_on:
      plc:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  cgs-data: {}
